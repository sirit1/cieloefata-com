<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="cover-sello.jpg"/>
<meta name="theme-color" content="#08111b"/>
<title>Tratado | Cielo Efata</title>
<meta name="description" content="El tratado se lee aquí, como un libro, con el pase de la hoja."/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0f2033;--gold:#d4b56a;--parch:#efe3c6;--paper:#fffaf0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#08111b;color:var(--parch);font-family:Source Sans 3,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--gold);margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--parch);text-decoration:none;font:inherit;cursor:pointer}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px 8px}
.spread{position:relative;width:min(100%, 42rem);height:min(78dvh, 52rem);perspective:1800px}
.under,.leaf{position:absolute;inset:0;width:100%;height:100%;border-radius:0 .75rem .75rem 0;background:var(--paper);overflow:hidden}
.under{z-index:0}
.leaf{z-index:1;transform-origin:left center;transform-style:preserve-3d;box-shadow:0 18px 50px -22px rgba(0,0,0,.65),8px 0 24px -18px rgba(0,0,0,.4);cursor:pointer;transition:transform 640ms cubic-bezier(.645,.045,.355,1)}
.leaf::after{content:"";position:absolute;top:0;right:0;bottom:0;width:2.2rem;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(15,32,51,.08))}
.leaf.next{transform:rotateY(-155deg);box-shadow:-18px 8px 40px -12px rgba(0,0,0,.55)}
.leaf.prev{transform:rotateY(16deg)}
.leaf img,.under img{display:block;width:100%;height:100%;object-fit:contain;object-position:center top;background:var(--paper);user-select:none;-webkit-user-drag:none}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#0f2033;color:var(--parch);text-align:center;padding:24px}
.cover img{width:auto;height:min(58%, 22rem);object-fit:contain;border-radius:2px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.cover p{margin:18px 0 0;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.cover h1{font-family:Cormorant Garamond,serif;font-size:clamp(1.6rem,4vw,2.2rem);margin:8px 0 0;font-weight:600}
.msg{max-width:28em;margin:12px auto 0;line-height:1.65;color:#c9d3de}
.side{position:absolute;top:50%;z-index:4;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:999px;background:transparent;color:var(--gold);cursor:pointer;display:none}
.side:disabled{opacity:.3}
.side.l{left:4px}
.side.r{right:4px}
@media(min-width:700px){.side{display:grid;place-items:center}}
.bar{padding:4px 18px calc(12px + env(safe-area-inset-bottom))}
.bar input{width:100%;accent-color:#d4b56a}
.folio{text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--gold);margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;margin-top:16px;background:#d4b56a;color:#0d1a2b;text-decoration:none;border-radius:8px;font-weight:500}
@media(prefers-reduced-motion:reduce){.leaf{transition:none}}
</style>
</head>
<body>
<header class="top">
<p class="kicker" id="kicker">Tratado</p>
<a class="ghost" href="tratados.html" aria-label="Cerrar el libro">Cerrar</a>
</header>
<div class="stage" id="stage">
<button class="side l" id="prev" aria-label="Página anterior" disabled>‹</button>
<button class="side r" id="next" aria-label="Página siguiente">›</button>
<div class="spread" id="spread">
<div class="under" id="under" hidden></div>
<article class="leaf" id="leaf"></article>
</div>
</div>
<div class="bar">
<input type="range" id="scrub" min="0" max="0" value="0" aria-label="Página"/>
<p class="folio" id="folio"></p>
</div>
<script type="module">
const BOOKS = {
  "muerte-y-vida": { n:"06", mes:"Septiembre 2026", title:"La muerte y la vida", ref:"Proverbios 18:21", drive:"1JQrDjcNJtt6yeZ-nKErkc2k6xFBDXSwL", cap:"https://www.revelatio.app/leer?libro=proverbios&cap=18&vs=21" }
};

const q = new URLSearchParams(location.search);
const slug = q.get("slug") || (location.hash || "").replace(/^#/, "") || "muerte-y-vida";
const book = BOOKS[slug];
const leafEl = document.getElementById("leaf");
const underEl = document.getElementById("under");
const kicker = document.getElementById("kicker");
const folio = document.getElementById("folio");
const scrub = document.getElementById("scrub");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pages = [];
let i = 0;
let flip = null;
let total = 0;

if (!book) {
  kicker.textContent = "Tratado";
  leafEl.innerHTML = `<div class="cover"><p>Este mes se lee La muerte y la vida.</p><a class="btn" href="tratados.html">Volver a Tratados</a></div>`;
} else {
  document.title = book.title + " | Cielo Efata";
  kicker.textContent = `Tratado ${book.n} · ${book.mes} · ${book.ref}`;
  showCover("Abriendo el tratado");
  openPdf();
}

function showCover(msg) {
  leafEl.innerHTML = `<div class="cover"><img src="tratados/${slug}.jpg" alt=""/><p>${msg}</p><h1>${book.title}</h1></div>`;
}

function fail() {
  leafEl.innerHTML = `<div class="cover"><h1>${book.title}</h1><p class="msg">El PDF no pudo abrirse en este aparato. El tratado sigue siendo de la casa: ábrelo en otra ventana, o en Drive.</p>
    <a class="btn" href="tratados/${slug}.pdf" target="_blank" rel="noreferrer">Abrir el PDF</a>
    <a class="btn" style="background:transparent;color:#d4b56a;box-shadow:inset 0 0 0 1px #d4b56a" href="https://drive.google.com/file/d/${book.drive}/view" target="_blank" rel="noreferrer">Abrirlo en Drive</a>
    <p class="msg"><a href="${book.cap}">El capítulo, en RevelatiO</a></p></div>`;
}

async function raster(pdf, n) {
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const cssW = Math.min(720, window.innerWidth - 24);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const viewport = page.getViewport({ scale: (cssW / base.width) * dpr });
  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(viewport.width);
  canvas.height = Math.floor(viewport.height);
  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.fillStyle = "#fffaf0";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport, background: "#fffaf0", intent: "display" }).promise;
  return canvas.toDataURL("image/jpeg", 0.92);
}

async function openPdf() {
  try {
    const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    const pdf = await pdfjs.getDocument({ url: `tratados/${slug}.pdf`, withCredentials: false }).promise;
    total = pdf.numPages;
    for (let n = 0; n < total; n++) pages[n] = null;
    scrub.max = Math.max(total - 1, 0);
    await paint(pdf, 0);
    await paint(pdf, 1);
    render();
    paint(pdf, 2);
    window.__pdf = pdf;
  } catch (err) {
    fail();
  }
}

async function paint(pdf, n) {
  if (n < 0 || n >= total || pages[n]) return;
  try { pages[n] = await raster(pdf, n + 1); } catch { /* hoja ilegible */ }
}

function go(dir) {
  const next = i + dir;
  if (next < 0 || next >= total || flip) return;
  if (reduce) { i = next; render(); return; }
  flip = dir === 1 ? "next" : "prev";
  leafEl.classList.toggle("next", flip === "next");
  leafEl.classList.toggle("prev", flip === "prev");
  setTimeout(() => {
    i = next;
    flip = null;
    leafEl.classList.remove("next", "prev");
    render();
  }, 640);
}

function render() {
  const src = pages[i];
  const nxt = pages[i + 1];
  if (src) {
    leafEl.innerHTML = `<img src="${src}" alt="Hoja ${i + 1} de ${book.title}" draggable="false"/>`;
  } else {
    leafEl.innerHTML = `<div class="cover"><p>Componiendo la hoja</p></div>`;
  }
  if (nxt) {
    underEl.hidden = false;
    underEl.innerHTML = `<img src="${nxt}" alt="" draggable="false"/>`;
  } else {
    underEl.hidden = true;
    underEl.innerHTML = "";
  }
  folio.textContent = total ? `Hoja ${i + 1} de ${total}` : book.ref;
  scrub.value = String(i);
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i >= total - 1;
  const pdf = window.__pdf;
  if (pdf) {
    paint(pdf, i + 1);
    paint(pdf, i - 1);
    paint(pdf, i + 2);
  }
}

document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
scrub.oninput = () => { i = Number(scrub.value); render(); };
leafEl.addEventListener("click", (e) => {
  const r = leafEl.getBoundingClientRect();
  const x = e.clientX - r.left;
  if (x > r.width * 0.62) go(1);
  else if (x < r.width * 0.38) go(-1);
});
let touch = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", (e) => { touch = { x: e.changedTouches[0].clientX, t: Date.now() }; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x;
  const dt = Date.now() - touch.t;
  touch = null;
  if (dt > 700 || Math.abs(dx) < 48) return;
  go(dx < 0 ? 1 : -1);
});
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1);
  if (e.key === "Escape") location.href = "tratados.html";
});
</script>
<script src="escritura.js" defer></script>
</body>
</html>
